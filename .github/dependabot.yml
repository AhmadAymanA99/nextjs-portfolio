# Weekly dependency updates. Minor and patch bumps arrive as one grouped pull
# request; major versions and security fixes come one by one. CI runs on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @typescript-eslint/parser 8.x supports TypeScript < 6.1, so a
      # TypeScript major breaks `npm ci`. Remove once typescript-eslint
      # supports the new major (check its peer range for typescript).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
